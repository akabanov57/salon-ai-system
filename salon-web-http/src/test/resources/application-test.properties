# Tests run entirely over clean unencrypted local loopback ports
server.ssl.enabled=false
server.port=0
telegram.webhook.secret-token=
telegram.bot.token=

# Deactivates the registration automation during test suites
server.public.url=

# Декларативное управление сетевыми аспектами
# Если выставлено в true, фильтр WebFilters.auditMessageTrace компилируется и сохраняет диалоги в БД
salon.filters.message-trace.enabled=false
