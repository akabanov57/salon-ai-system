# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format
[versions]
jooq = "3.21.6"
avajeInject = "12.6"
avajeHttp = "3.11-RC1"
avajeJex = "3.6" # Добавляем версию веб-сервера Jex
avajeJsonb = "3.14"
avajeValidator = "2.17"
avajeConfig = "5.2" # Актуальная версия avaje-config
avajeJexSSL = "3.6"
vaadin = "25.2.3"
langchain4j = "1.18.0"
jackson = "2.22.1"
postgres = "42.7.13"
h2 = "2.4.240"
hikari = "7.1.0"
jakartaXmlBind = "4.0.5"

# Pinned standard version for jOOQ compatibility
javaxAnnotation = "1.3.2"
jsr305 = "3.0.2"

mockito = "5.23.0"

# slf4j = "2.0.18"
# logback = "1.5.37"

[plugins]
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
vaadin = { id = "com.vaadin", version.ref = "vaadin" }


[libraries]
# 1. Работа с базой данных (jOOQ & Драйверы)
jooq-core = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-meta-extensions = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooq" }
db-postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }
db-h2 = { module = "com.h2database:h2", version.ref = "h2" }
db-hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

# 2. Avaje Dependency Injection
avaje-inject = { module = "io.avaje:avaje-inject", version.ref = "avajeInject" }
avaje-inject-test = {module = "io.avaje:avaje-inject-test", version.ref = "avajeInject"}
avaje-inject-generator = { module = "io.avaje:avaje-inject-generator", version.ref = "avajeInject" }

# 3. Avaje HTTP (Сервер для Вебхуков и Клиент для отправки сообщений/ИИ)
# Базовый API для аннотаций @Controller, @Post
avaje-http-api = { module = "io.avaje:avaje-http-api", version.ref = "avajeHttp" }

# ПРАВИЛЬНЫЙ генератор (процессор аннотаций) для веб-сервера Jex
avaje-http-jex-generator = { module = "io.avaje:avaje-http-jex-generator", version.ref = "avajeHttp" }
avaje-http-client-generator = {module = "io.avaje:avaje-http-client-generator", version.ref = "avajeHttp"}

# Сам легковесный встроенный веб-сервер
avaje-jex = { module = "io.avaje:avaje-jex", version.ref = "avajeJex" }
avaje-jex-ssl = {module = "io.avaje:avaje-jex-ssl", version.ref = "avajeJexSSL"}
avaje-jsonb = { module = "io.avaje:avaje-jsonb", version.ref = "avajeJsonb" }
avaje-jsonb-generator = { module = "io.avaje:avaje-jsonb-generator", version.ref = "avajeJsonb" }
avaje-jsonb-inject-plugin = {module = "io.avaje:avaje-jsonb-inject-plugin", version.ref = "avajeJsonb"}

# Клиент для отправки ответов в мессенджеры
avaje-http-client = { module = "io.avaje:avaje-http-client", version.ref = "avajeHttp" }

# 4. Avaje Validator
avaje-validator = { module = "io.avaje:avaje-validator", version.ref = "avajeValidator" }
avaje-validator-constraints = {module = "io.avaje:avaje-validator-constraints", version.ref = "avajeValidator"}
avaje-validator-generator = { module = "io.avaje:avaje-validator-generator", version.ref = "avajeValidator" }
avaje-validator-inject-plugin = {module = "io.avaje:avaje-validator-inject-plugin", version.ref = "avajeValidator"}

# 5. Avaje Config
avaje-config = { module = "io.avaje:avaje-config", version.ref = "avajeConfig" }

# 5. ИИ Движок (LangChain4j)
langchain4j-core = { module = "dev.langchain4j:langchain4j-core", version.ref = "langchain4j" }
# High-level orchestration engine containing @SystemMessage, @MemoryId, and @UserMessage annotations
langchain4j = { module = "dev.langchain4j:langchain4j", version.ref = "langchain4j" }
# Модуль для работы с локальным ИИ через утилиту Ollama
langchain4j-ollama = { module = "dev.langchain4j:langchain4j-ollama", version.ref = "langchain4j" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

# 6. Веб-интерфейс Vaadin
vaadin-core = { module = "com.vaadin:vaadin-core", version.ref = "vaadin" }

# 7. Для того, чтобы компиляция с jOOQ не выдавала предупреждающих сообщений.
api-jakarta-xml-bind = { module = "jakarta.xml.bind:jakarta.xml.bind-api", version.ref = "jakartaXmlBind" }
api-javax-annotation = { module = "javax.annotation:javax.annotation-api", version.ref = "javaxAnnotation" }
api-jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }

# 8. Tests
test-mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }

# 9. Log.
# slf4j-api = {module = "org.slf4j:slf4j-api", version.ref = "slf4j"}
# logback-classic = {module = "ch.qos.logback:logback-classic", version.ref = "logback"}
