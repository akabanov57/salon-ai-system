# Network Endpoint Settings
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=secret/salon-keystore.p12
server.ssl.key-store-password=MySecurePassword123

# Database Connection Pool
# db.url=jdbc:postgresql://localhost:5432/salon_prod
# db.username=salon_admin
# db.password=ProductionSecretPasswordHere
# db.dialect=POSTGRESQL
# db.pool.max-size=10
# db.auto-migrate=true

db.url=jdbc:h2:mem:salontestdb;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
db.username=sa
db.password=
db.dialect=H2
db.pool.max-size=2
# Разрешаем фабрике накатить схему в память H2
db.auto-migrate=true

# AI Engine Models Tracking Configuration
ai.model.url=http://localhost:11434
ai.model.name=llama3
ai.model.timeout-seconds=90

# Messenger API Credentials Tokens (Output Ports)
# доказывает Телеграму, что вы — это вы.
#telegram.bot.token=777777777:AAH_FakeTokenForTelegramAPI Here
telegram.bot.token=
telegram.bot.username=SalonAiBookingBot
# Секретный токен для проверки подлинности входящих вебхуков Telegram
# доказывает вашему серверу, что Телеграм — это Телеграм.
telegram.webhook.secret-token=MySuperSecretTelegramToken12345X
telegram.api.baseUrl=https://api.telegram.org

# Public gateway URL where Telegram will forward incoming POST webhooks
# (In production, this must point to your live domain or reverse-proxy path)
server.public.url=https://my-salon-domain.com

instagram.page.id=meta_page_id_here
instagram.access.token=meta_graph_api_long_lived_token_here

# Декларативное управление сетевыми аспектами
# Если выставлено в true, фильтр WebFilters.auditMessageTrace компилируется и сохраняет диалоги в БД
salon.filters.message-trace.enabled=true