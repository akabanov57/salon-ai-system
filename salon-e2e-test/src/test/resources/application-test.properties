# Network Endpoint Settings
jex.ssl.enabled=false
jex.host=[::]
jex.port=0
jex.ssl.keystorePath=classpath:certs/salon-keystore.p12
jex.ssl.key-store-password=MySecurePassword123

# ИСПРАВЛЕНО: Убран флаг DATABASE_TO_LOWER=TRUE
db.url=jdbc:h2:mem:salontestdb;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
db.username=sa
db.password=
db.dialect=H2
db.pool.max-size=2
# Разрешаем фабрике накатить схему в память H2
db.auto-migrate=true

telegram.webhook.secret-token=
telegram.bot.token=

# Public gateway URL where Telegram will forward incoming POST webhooks
# (In production, this must point to your live domain or reverse-proxy path)
salon.telegram.public.url=

