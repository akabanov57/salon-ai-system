# Network Endpoint Settings
jex.ssl.enabled=false
jex.host=0.0.0.0
jex.port=8082
jex.ssl.keystorePath=classpath:certs/salon-keystore.p12
jex.ssl.key-store-password=MySecurePassword123

# TELEGRAM API CREDENTIALS TOKENS (Output Ports)

# Доказывает Телеграму, что вы — это вы. Полученный от @BotFather
telegram.bot.token=777777777:AAH_FakeTokenForTelegramAPI
telegram.bot.username=SalonAiBookingBot

# Секретный токен для проверки подлинности входящих вебхуков Telegram.
# Доказывает серверу салона, что Телеграм — это Телеграм.
# Сгенерированный мной секретный токен для вебхука.
telegram.webhook.secret-token=MySuperSecretTelegramToken12345X
telegram.webhook.clear-on-shutdown=true

# Public gateway URL where Telegram will forward incoming POST webhooks
# (In production, this must point to your live domain or reverse-proxy path)
# Передаётся телеграму при регистрации.
salon.telegram.webhook.url=http://${jex.host}:${jex.port}

# Значение для production. Смотри salon-web-http WebConfiguration.
#telegram.api.baseUrl=https://api.telegram.org
telegram.api.baseUrl=http://localhost:8083

# ИСПРАВЛЕНО: Убран флаг DATABASE_TO_LOWER=TRUE
db.url=jdbc:h2:mem:salontestdb;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
db.username=sa
db.password=
db.dialect=H2
db.pool.max-size=2
# Разрешаем фабрике накатить схему в память H2
db.auto-migrate=true

